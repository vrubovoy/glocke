# One-time setup: create the external `schloss-net`, initialize submodules,
# copy .env.example to .env, and replace all five HMAC placeholders with distinct
# generated secrets. Neither service publishes a host port; use the sibling
# tor gateway for browser access.
services:
  glocke-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3004
      DATABASE_PATH: ${GLOCKE_DATABASE_PATH:-/data/glocke.db}
      SCHLUSSEL_JWKS_URL: ${SCHLUSSEL_JWKS_URL:-http://schlussel:4000/.well-known/jwks.json}
      SCHLUSSEL_INTERNAL_URL: ${SCHLUSSEL_INTERNAL_URL:-http://schlussel:4000}
      GLOCKE_TO_SCHLUSSEL_HMAC_KEY_ID: ${GLOCKE_TO_SCHLUSSEL_HMAC_KEY_ID:-glocke-v1}
      GLOCKE_TO_SCHLUSSEL_HMAC_SECRET: ${GLOCKE_TO_SCHLUSSEL_HMAC_SECRET:?set GLOCKE_TO_SCHLUSSEL_HMAC_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-schlussel}
      ALLOWED_ORIGINS: ${GLOCKE_ALLOWED_ORIGINS:-https://localhost,https://auth.localhost,https://kuvert.localhost,https://tafel.localhost,https://zettel.localhost,https://glocke.localhost,https://schrank.localhost,https://herold.localhost}
      KUVERT_ORIGIN: ${KUVERT_URL:-https://kuvert.localhost}
      TAFEL_ORIGIN: ${TAFEL_URL:-https://tafel.localhost}
      GLOCKE_EVENT_SOURCES: ${GLOCKE_EVENT_SOURCES:-schlussel,kuvert,tafel,zettel}
      GLOCKE_SOURCE_KEY_ID_SCHLUSSEL: ${SCHLUSSEL_TO_GLOCKE_HMAC_KEY_ID:-schlussel-v1}
      GLOCKE_SOURCE_SECRET_SCHLUSSEL: ${SCHLUSSEL_TO_GLOCKE_HMAC_SECRET:?set SCHLUSSEL_TO_GLOCKE_HMAC_SECRET}
      # Same var names each producer's own docker-compose.yml already
      # reads for its outgoing HMAC credentials (e.g. kuvert's
      # KUVERT_TO_GLOCKE_HMAC_SECRET) - one shared .env value keeps both
      # sides in sync automatically, same convention as schlussel above.
      GLOCKE_SOURCE_KEY_ID_KUVERT: ${KUVERT_TO_GLOCKE_HMAC_KEY_ID:-kuvert-v1}
      GLOCKE_SOURCE_SECRET_KUVERT: ${KUVERT_TO_GLOCKE_HMAC_SECRET:?set KUVERT_TO_GLOCKE_HMAC_SECRET}
      GLOCKE_SOURCE_KEY_ID_TAFEL: ${TAFEL_TO_GLOCKE_HMAC_KEY_ID:-tafel-v1}
      GLOCKE_SOURCE_SECRET_TAFEL: ${TAFEL_TO_GLOCKE_HMAC_SECRET:?set TAFEL_TO_GLOCKE_HMAC_SECRET}
      GLOCKE_SOURCE_KEY_ID_ZETTEL: ${ZETTEL_TO_GLOCKE_HMAC_KEY_ID:-zettel-v1}
      GLOCKE_SOURCE_SECRET_ZETTEL: ${ZETTEL_TO_GLOCKE_HMAC_SECRET:?set ZETTEL_TO_GLOCKE_HMAC_SECRET}
      GLOCKE_MAX_SKEW_SECONDS: ${GLOCKE_MAX_SKEW_SECONDS:-300}
      GLOCKE_MAX_EVENT_BYTES: ${GLOCKE_MAX_EVENT_BYTES:-65536}
      GLOCKE_WORKER_INTERVAL_MS: ${GLOCKE_WORKER_INTERVAL_MS:-1000}
      GLOCKE_RECIPIENT_FETCH_TIMEOUT_MS: ${GLOCKE_RECIPIENT_FETCH_TIMEOUT_MS:-5000}
      GLOCKE_WORKER_LEASE_MS: ${GLOCKE_WORKER_LEASE_MS:-30000}
      GLOCKE_PUBLIC_URL: ${GLOCKE_URL:-https://glocke.localhost}
      GLOCKE_BROWSER_PUSH_ENABLED: ${GLOCKE_BROWSER_PUSH_ENABLED:-false}
      GLOCKE_VAPID_SUBJECT: ${GLOCKE_VAPID_SUBJECT:-}
      GLOCKE_VAPID_PUBLIC_KEY: ${GLOCKE_VAPID_PUBLIC_KEY:-}
      GLOCKE_VAPID_PRIVATE_KEY: ${GLOCKE_VAPID_PRIVATE_KEY:-}
      GLOCKE_PUSH_ALLOWED_ENDPOINT_HOSTS: ${GLOCKE_PUSH_ALLOWED_ENDPOINT_HOSTS:-}
      GLOCKE_PUSH_FETCH_TIMEOUT_MS: ${GLOCKE_PUSH_FETCH_TIMEOUT_MS:-10000}
      GLOCKE_PUSH_WORKER_LEASE_MS: ${GLOCKE_PUSH_WORKER_LEASE_MS:-30000}
      GLOCKE_PUSH_WORKER_INTERVAL_MS: ${GLOCKE_PUSH_WORKER_INTERVAL_MS:-1000}
      GLOCKE_PUSH_MAX_ATTEMPTS: ${GLOCKE_PUSH_MAX_ATTEMPTS:-8}
      GLOCKE_PUSH_RETRY_BASE_DELAY_MS: ${GLOCKE_PUSH_RETRY_BASE_DELAY_MS:-1000}
      GLOCKE_PUSH_RETRY_MAX_DELAY_MS: ${GLOCKE_PUSH_RETRY_MAX_DELAY_MS:-21600000}
      GLOCKE_PUSH_MAX_SUBSCRIPTIONS_PER_USER: ${GLOCKE_PUSH_MAX_SUBSCRIPTIONS_PER_USER:-10}
      GLOCKE_PUSH_DELIVERY_RETENTION_MS: ${GLOCKE_PUSH_DELIVERY_RETENTION_MS:-2592000000}
    volumes:
      - glocke-data:/data
    networks:
      - schloss-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  glocke-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SCHLUSSEL_URL: ${SCHLUSSEL_WEB_URL:-https://auth.localhost}
        VITE_SCHLOSS_URL: ${SCHLOSS_URL:-https://localhost}
    restart: unless-stopped
    depends_on:
      glocke-backend:
        condition: service_healthy
    networks:
      - schloss-net

volumes:
  glocke-data:
    name: glocke-data

networks:
  schloss-net:
    external: true
