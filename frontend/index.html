         favicons unusually aggressively, often ignoring normal page
         reloads/cache-clears entirely, so a same-URL asset update (the
         rose-to-blue recolor) never got picked up for already-visited
         users. Bump this suffix again if the icon ever needs to change. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
